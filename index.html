<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="3分、15分の作業を行うとガチャが引けるサイトです">
<meta property="og:title" content="作業スタンプガチャ">
<meta property="og:description" content="3分、15分の作業を行うとガチャが引けるサイトです">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tsukurukokaneko.github.io/stamp-gacha/">
<meta property="og:locale" content="ja_JP">
<title>作業スタンプガチャ</title><style>.bg-white{background:white}*{box-sizing:border-box}body{margin:0;padding:24px 12px;background:#f0f1eb}button{font:inherit;border:0;background:transparent;color:inherit}p{margin:0}button:focus-visible{outline:3px solid #c68a69;outline-offset:3px}.w-full{width:100%}.max-w-\[430px\]{max-width:430px}.mx-auto{margin-left:auto;margin-right:auto}.text-\[\#313b35\]{color:#313b35}.bg-\[\#faf9f4\]{background:#faf9f4}.rounded-\[22px\]{border-radius:22px}.border{border:1px solid}.border-\[\#e5e6dd\]{border-color:#e5e6dd}.p-4{padding:16px}.relative{position:relative}.overflow-hidden{overflow:hidden}.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.mb-5{margin-bottom:20px}.text-\[11px\]{font-size:11px}.tracking-\[\.18em\]{letter-spacing:.18em}.text-\[\#7a927e\]{color:#7a927e}.font-bold{font-weight:700}.mb-1{margin-bottom:4px}.text-\[22px\]{font-size:22px}.tracking-tight{letter-spacing:-.025em}.text-\[\#c68a69\]{color:#c68a69}.rounded-full{border-radius:9999px}.bg-\[\#e7ede3\]{background:#e7ede3}.px-3{padding-left:12px;padding-right:12px}.py-2{padding-top:8px;padding-bottom:8px}.text-\[\#527c67\]{color:#527c67}.font-semibold{font-weight:600}.rounded-2xl{border-radius:16px}.border-\[\#e9e9e0\]{border-color:#e9e9e0}.mb-4{margin-bottom:16px}.mb-2{margin-bottom:8px}.text-xs{font-size:12px}.items-baseline{align-items:baseline}.gap-1{gap:4px}.mb-3{margin-bottom:12px}.text-\[30px\]{font-size:30px}.text-sm{font-size:14px}.ml-auto{margin-left:auto}.h-2{height:8px}.bg-\[\#edf0e9\]{background:#edf0e9}.bg-\[\#83a58c\]{background:#83a58c}.p-3{padding:12px}.px-1{padding-left:4px;padding-right:4px}.p-2{padding:8px}.text-base{font-size:16px}.grid{display:grid}.gap-\[2px\]{gap:2px}.text-center{text-align:center}.text-\[10px\]{font-size:10px}.text-\[\#c27e60\]{color:#c27e60}.justify-center{justify-content:center}.gap-4{gap:16px}.mt-4{margin-top:16px}.bg-\[\#eff2e9\]{background:#eff2e9}.py-1{padding-top:4px;padding-bottom:4px}.w-\[78px\]{width:78px}.h-\[78px\]{height:78px}.border-\[5px\]{border-width:5px}.border-\[\#d7e3d7\]{border-color:#d7e3d7}.shrink-0{flex-shrink:0}.text-\[21px\]{font-size:21px}.tabular-nums{font-variant-numeric:tabular-nums}.flex-1{flex:1}.leading-relaxed{line-height:1.625}.hidden{display:none!important}.gap-3{gap:12px}.mt-3{margin-top:12px}.underline{text-decoration:underline}.mt-6{margin-top:24px}.text-5xl{font-size:48px}.my-7{margin-top:28px;margin-bottom:28px}.text-lg{font-size:18px}.mt-2{margin-top:8px}.text-6xl{font-size:60px}.my-5{margin-top:20px;margin-bottom:20px}.text-\[42px\]{font-size:42px}.my-2{margin-top:8px;margin-bottom:8px}</style></head><body>

<div id="stamp-app" class="w-full max-w-[430px] mx-auto text-[#313b35]">
  <style>
    #stamp-app{font-family:ui-sans-serif,system-ui,"Noto Sans JP",sans-serif;font-size:14px}
    #stamp-app .muted{color:#888f86}
    #stamp-app button{cursor:pointer}
    #stamp-app button:disabled{opacity:.4;cursor:default}
    #stamp-app .mainbtn{background:#527c67;color:white;border-radius:15px;padding:15px;font-weight:700;width:100%;font-size:15px}
    #stamp-app .day{min-height:49px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 1px;border-radius:9px;position:relative}
    #stamp-app .day.today{background:#e6efe7}
    #stamp-app .day .num{font-size:12px}
    #stamp-app .stamp{font-size:18px;line-height:24px;font-weight:900;color:#c27e60;transform:rotate(-12deg)}
    #stamp-app .weekly{font-size:10px;color:#527c67;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;border-left:1px dashed #d9ded6}
    #stamp-app .modal{position:absolute;inset:0;background:#27352fc2;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:22px}
    #stamp-app .modalbox{background:#fffdf9;border-radius:23px;padding:28px 20px;text-align:center;width:100%;max-width:340px;box-shadow:0 18px 50px #0002}
    #stamp-app .prize{animation:stamp-pop .4s ease-out}
    @keyframes stamp-pop{0%{transform:scale(.5) rotate(-18deg);opacity:0}70%{transform:scale(1.12) rotate(5deg)}100%{transform:scale(1);opacity:1}}
    #stamp-app .ghost{background:#f1f3ec;border-radius:12px;padding:12px 14px;font-weight:650}
  </style>
  <div class="rounded-[22px] p-4 sm:p-5 relative overflow-hidden">
    <div class="flex items-center justify-between mb-5">
      <div>
        <div class="text-[11px] tracking-[.18em] text-[#7a927e] font-bold mb-1">MY LITTLE PROGRESS</div>
        <div class="text-[22px] font-bold tracking-tight">作業のきろく <span class="text-[#c68a69]">✳</span></div>
      </div>
    </div>
    <div class="rounded-2xl p-4 mb-4">
      <div class="flex items-center gap-1 mb-2">
        <span class="text-xs muted font-bold">今月の獲得報酬</span>
        <span class="text-xs muted">予算2,000円</span>
      </div>
      <div class="flex items-baseline gap-1 mb-3"><span id="earned" class="text-[30px] font-bold tracking-tight">0</span><span class="text-sm">円</span></div>
    </div>
    <div class="bg-white border border-[#e9e9e0] rounded-2xl p-3 mb-4">
      <div class="flex items-center justify-between mb-4 px-1">
        <button id="prev" class="p-2 rounded-full hover:bg-[#f1f3ec]" aria-label="前月">‹</button>
        <div id="monthlabel" class="font-bold text-base"></div>
        <button id="next" class="p-2 rounded-full hover:bg-[#f1f3ec]" aria-label="翌月">›</button>
      </div>
      <div class="grid gap-[2px] mb-2" style="grid-template-columns:repeat(7,minmax(0,1fr)) minmax(48px,1.2fr)">
        <div class="text-center text-[10px] muted">月</div><div class="text-center text-[10px] muted">火</div><div class="text-center text-[10px] muted">水</div><div class="text-center text-[10px] muted">木</div><div class="text-center text-[10px] muted">金</div><div class="text-center text-[10px] muted">土</div><div class="text-center text-[10px] text-[#c27e60]">日</div><div class="text-center text-[10px] muted">週合計</div>
      </div>
      <div id="calgrid" class="grid gap-[2px]" style="grid-template-columns:repeat(7,minmax(0,1fr)) minmax(48px,1.2fr)"></div>
      <div class="flex items-center justify-center gap-4 mt-4 text-[10px] muted"><span>✳ 作業した日</span><span>✳✳ 2回達成した日</span></div>
    </div>
    <div class="bg-[#eff2e9] rounded-2xl p-4 mb-3">
      <div class="flex items-center justify-between mb-2"><span class="font-bold">今日の作業</span><span id="stagebadge" class="text-[11px] text-[#527c67] bg-white rounded-full px-3 py-1">準備OK</span></div>
      <div class="flex items-center gap-4 mb-3">
        <div class="w-[78px] h-[78px] bg-white rounded-full border-[5px] border-[#d7e3d7] flex items-center justify-center shrink-0"><span id="clock" class="font-bold text-[21px] tabular-nums">03:00</span></div>
        <div class="flex-1">
          <div id="stageheading" class="font-bold mb-1">まずは3分だけ</div>
          <div id="stagedesc" class="text-xs muted leading-relaxed">好きな作業を少しだけ進めてみましょう。</div>
        </div>
      </div>
      <button id="startbtn" class="mainbtn">作業をはじめる</button>
      <button id="claimbtn" class="mainbtn hidden">作業をした！ ✳ ガチャを引く</button>
      <div class="flex justify-center gap-3 mt-3">
        <button id="pausebtn" class="text-xs muted underline hidden">一時停止</button>
        <button id="resetbtn" class="text-xs muted underline">タイマーをリセット</button>
      </div>
    </div>
    <div class="text-xs muted text-center mb-1" id="footnote">3分で1回、さらに15分で1回。1日最大2回。</div>
    <ul class="text-xs muted" style="margin:28px 0 4px;padding-left:1.5em;line-height:1.8;text-align:left">
      <li style="margin-bottom:8px">同じ端末・同じブラウザなら、閉じても記録が残ります。</li>
      <li style="margin-bottom:8px">別のスマホやブラウザとは同期されません。</li>
      <li style="margin-bottom:8px">サイトの保存データを削除すると記録も消えます。</li>
      <li>保存対象は日付・スタンプ・報酬額で、途中のタイマー時間は保存しません。</li>
    </ul>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="作業ガチャ">
      <div class="modalbox">
        <div class="text-xs tracking-[.18em] text-[#7a927e] font-bold mb-4">TODAY'S REWARD</div>
        <div id="modalcontent"></div>
        <button id="modalaction" class="mainbtn mt-6"></button>
      </div>
    </div>
  </div>
  <script>
  (() => {
    const root=document.getElementById('stamp-app');
    if(root.dataset.ready)return;root.dataset.ready='1';
    const $=id=>root.querySelector('#'+id);
    const now=new Date();
    const datekey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const today=datekey(now);
    let data={};
    try{data=JSON.parse(localStorage.getItem('stamp-gacha-v1')||'{}')}catch(e){}
    const save=()=>{try{localStorage.setItem('stamp-gacha-v1',JSON.stringify(data))}catch(e){}};
    const monthKey=d=>datekey(d).slice(0,7);
    const monthTotal=key=>Object.entries(data).filter(([d])=>d.startsWith(key)).reduce((a,[,v])=>a+(v.prizes||[]).reduce((x,y)=>x+y,0),0);
    let view=new Date(now.getFullYear(),now.getMonth(),1);
    let elapsed=0,startedAt=0,running=false,paused=false,stage=0;
    const current=()=>data[today]||{prizes:[]};
    function renderCalendar(){
      $('monthlabel').textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;
      const grid=$('calgrid');grid.innerHTML='';
      const first=new Date(view.getFullYear(),view.getMonth(),1);
      const offset=(first.getDay()+6)%7;
      const start=new Date(first);start.setDate(1-offset);
      const end=new Date(view.getFullYear(),view.getMonth()+1,0);
      const count=Math.ceil((offset+end.getDate())/7)*7;
      for(let w=0;w<count/7;w++){
        let sum=0;
        for(let j=0;j<7;j++){
          const d=new Date(start);d.setDate(start.getDate()+w*7+j);
          const k=datekey(d),record=data[k]||{prizes:[]},n=record.prizes.length;
          sum+=(record.prizes||[]).reduce((a,b)=>a+b,0);
          const cell=document.createElement('div');
          cell.className='day'+(k===today?' today':'');
          if(d.getMonth()!==view.getMonth())cell.style.opacity='.3';
          cell.innerHTML=`<span class="num">${d.getDate()}</span>${n?`<span class="stamp">${n===1?'✳':'✳✳'}</span>`:''}`;
          grid.appendChild(cell);
        }
        const weekly=document.createElement('div');weekly.className='weekly';weekly.innerHTML=`${sum.toLocaleString()}<br>円`;grid.appendChild(weekly);
      }
      const amount=monthTotal(monthKey(view));
      $('earned').textContent=amount.toLocaleString();
    }
    function syncStage(){
      const n=current().prizes.length;
      stage=n;
      $('startbtn').classList.add('hidden');$('claimbtn').classList.add('hidden');$('pausebtn').classList.add('hidden');
      if(n>=2){
        $('clock').textContent='✓';
        $('stageheading').textContent='今日は2回達成！';
        $('stagedesc').textContent='おつかれさまでした。今日のガチャは完了です。';
        $('stagebadge').textContent='完了';
        return;
      }
      const goal=n===0?180:900;
      const progress=elapsed+(running?Math.floor((Date.now()-startedAt)/1000):0);
      const left=Math.max(0,goal-progress);
      $('clock').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
      $('stageheading').textContent=n===0?'まずは3分だけ':'次は15分の作業';
      $('stagedesc').textContent=n===0?'3分達成すると最初のガチャを引けます。':'2回目のガチャまであと15分。休憩してからでもOK。';
      if(elapsed>=goal){
        $('stagebadge').textContent='ガチャ解放！';
        $('claimbtn').classList.remove('hidden');
      }else if(running){
        $('stagebadge').textContent='作業中';
        $('pausebtn').classList.remove('hidden');
        $('pausebtn').textContent='一時停止';
      }else{
        $('stagebadge').textContent=paused?'一時停止中':'準備OK';
        $('startbtn').classList.remove('hidden');
        $('startbtn').textContent=paused?'作業を再開':'作業をはじめる';
      }
    }
    function stop(){if(running){elapsed+=Math.floor((Date.now()-startedAt)/1000);running=false}}
    $('startbtn').onclick=()=>{startedAt=Date.now();running=true;paused=false;syncStage()};
    $('pausebtn').onclick=()=>{stop();paused=true;syncStage()};
    $('resetbtn').onclick=()=>{stop();elapsed=0;paused=false;syncStage()};
    setInterval(()=>{
      if(!running)return;
      const n=current().prizes.length,goal=n===0?180:900;
      if(elapsed+Math.floor((Date.now()-startedAt)/1000)>=goal){stop();elapsed=goal;}
      syncStage();
    },500);
    function showModal(html,label,callback){
      $('modalcontent').innerHTML=html;
      $('modalaction').textContent=label;
      $('modalaction').onclick=callback;
      $('modal').classList.remove('hidden');
    }
    function closeModal(){$('modal').classList.add('hidden')}
    $('claimbtn').onclick=()=>{
      const record=current();if(record.prizes.length>=2)return;
      const remaining=Math.max(0,2000-monthTotal(today.slice(0,7)));
      const values=[10,30,50,100],weights=[50,30,15,5];
      const eligible=values.map((v,i)=>({v,w:weights[i]})).filter(x=>x.v<=remaining);
      let prize=0;
      if(eligible.length){
        const sum=eligible.reduce((a,b)=>a+b.w,0);
        let r=Math.random()*sum;
        prize=eligible[eligible.length-1].v;
        for(const item of eligible){r-=item.w;if(r<0){prize=item.v;break}}
      }
      showModal('<div class="text-5xl my-7 prize">✳</div><div class="text-lg font-bold">ガチャを引こう！</div><p class="text-xs muted mt-2">今日の頑張りへのごほうび</p>','ガチャを引く',()=>{
        const latest=current();if(latest.prizes.length>=2){closeModal();return}
        latest.prizes.push(prize);data[today]=latest;save();
        elapsed=0;paused=false;running=false;
        renderCalendar();syncStage();
        showModal(`<div class="prize"><div class="text-6xl text-[#c27e60] my-5">✳</div><div class="text-sm muted">おめでとう！</div><div class="text-[42px] font-bold text-[#527c67] my-2">${prize}円<span class="text-base"> 獲得</span></div></div><p class="text-xs muted mt-3">カレンダーにスタンプを押しました</p>`, 'カレンダーに戻る',closeModal);
      });
    };
    $('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};
    $('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};
    renderCalendar();syncStage();
  })();
  </script>
</div>

</body></html>
